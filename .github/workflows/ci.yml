
name: BARQ DevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: self-hosted

    env:
      PUBLIC_PORT: 8080
      POSTGRES_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -r requirements.txt

      - name: Python syntax checks
        run: |
          python3.12 -m py_compile app/server.py
          python3.12 -m py_compile validate.py
          python3.12 -m py_compile failure_test.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          timeout 120 bash -c '
            until docker compose ps --format json | grep -q "\"Health\":\"healthy\""; do
              docker compose ps
              sleep 3
            done
          '

      - name: Show service status
        run: docker compose ps

      - name: Run environment validation
        run: ./validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            basanttt/barq-app:${{ github.sha }}
            basanttt/barq-app:latest
